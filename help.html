<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="device-detect.js"></script>
    <title>使用教學</title>
<script src="device-detect.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="help-page">

    <!-- 使用教學圖片 -->
    <img
        src="images/使用教學.png"
        class="help-image"
        alt="使用教學"
    >


    <!-- =================================
         右上三個按鈕
    ================================= -->

    <button
        class="help-control help-home"
        onclick="location.href='index.html'"
        aria-label="回首頁">
    </button>

    <button
        class="help-control help-current"
        onclick="location.href='help.html'"
        aria-label="使用教學">
    </button>

    <button
        class="help-control help-all"
        onclick="location.href='all-foods.html'"
        aria-label="全部品項">
    </button>


    <!-- =================================
         上一頁 / 下一頁
    ================================= -->

    <button
        class="help-prev-button"
        onclick="location.href='all-foods.html'"
        aria-label="上一頁">
    </button>

    <button
        class="help-next-button"
        onclick="location.href='index.html'"
        aria-label="下一頁">
    </button>

</div>

</body>
</html>
